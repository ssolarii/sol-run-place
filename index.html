<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>sol's quicklinks</title>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-TCHBCRP2LX"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){ dataLayer.push(arguments); }
  if (location.hostname === "sol.run.place" || location.hostname === "www.sol.run.place") {
    gtag('js', new Date());
    gtag('config', 'G-TCHBCRP2LX', {
      allow_google_signals: false,
      allow_ad_personalization_signals: false
    });
  }
</script>
<style>
  @font-face{font-family:'Helvetica Now Display';font-weight:400;font-style:normal;font-display:swap;
    src:url('./assets/fonts/HelveticaNowDisplay-Regular.woff2') format('woff2');}
  @font-face{font-family:'Helvetica Now Display';font-weight:400;font-style:italic;font-display:swap;
    src:url('./assets/fonts/HelveticaNowDisplay-RegIta.woff2') format('woff2');}
  @font-face{font-family:'Helvetica Now Display';font-weight:700;font-style:normal;font-display:swap;
    src:url('./assets/fonts/HelveticaNowDisplay-Bold.woff2') format('woff2');}
  @font-face{font-family:'Helvetica Now Display';font-weight:900;font-style:normal;font-display:swap;
    src:url('./assets/fonts/HelveticaNowDisplay-Black.woff2') format('woff2');}

  :root{
    --white:#ffffff;
    --dim:rgba(255,255,255,.72);
    --green:#3ecf6e;
    --font:'Helvetica Now Display',Helvetica,Arial,sans-serif;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--font);color:var(--white);background:#050705}

  .page{
    position:relative;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    padding:max(2rem,env(safe-area-inset-top)) 1.5rem max(1.75rem,env(safe-area-inset-bottom));
    background-image:linear-gradient(to bottom,rgba(0,0,0,.15),rgba(0,0,0,.1) 45%,rgba(0,0,0,.6) 100%),url('./background.jpg');
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
  }

  .title-wrap{text-align:center;padding-top:clamp(2rem,9vh,4.5rem)}
  .title{font-weight:900;font-size:clamp(1.9rem,8vw,2.6rem);letter-spacing:-0.01em}

  .links{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(1.6rem,5vh,2.3rem);padding:2rem 0}
  .link{color:var(--white);display:flex;flex-direction:column;align-items:center;gap:.5rem;text-decoration:none;transition:transform .15s ease,opacity .15s ease}
  .link:hover,.link:focus-visible{transform:scale(1.08);opacity:.85}
  .link img{height:clamp(38px,9vw,46px);width:auto;display:block}

  .status{display:flex;align-items:center;gap:.4rem;font-size:.85rem;color:var(--dim)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
  .dot[data-status="idle"]{background:#f5a623}
  .dot[data-status="dnd"]{background:#ed4245}
  .dot[data-status="offline"]{background:#747f8d}

  .footer{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;text-align:left}
  .meta{text-align:right}

  .eyebrow{font-style:italic;font-size:.8rem;color:var(--dim);margin-bottom:.15rem}
  .track{font-weight:900;font-size:clamp(1.1rem,5vw,1.4rem);text-transform:uppercase;line-height:1.05;max-width:60vw}
  .now-playing[data-state="now"] .eyebrow{color:var(--green);font-style:normal;font-weight:700}
  .now-playing[data-state="now"] .eyebrow::before{content:"";display:inline-block;width:6px;height:6px;margin-right:.4rem;border-radius:50%;background:var(--green);vertical-align:middle}
  .scrobble-time{font-size:.75rem;color:var(--dim);margin-top:.25rem}
  .artist{font-size:.95rem;color:var(--dim);margin-top:.1rem}
  .visitor{font-weight:900;font-size:.95rem}
  .private{display:inline-block;margin-top:.3rem;font-size:.85rem;color:var(--dim);text-decoration:underline;text-underline-offset:2px;cursor:default}

  .recent-toggle{text-align:left;align-self:flex-start;margin-top:.55rem;padding:0;border:0;background:none;color:var(--dim);font:inherit;font-size:.82rem;text-decoration:underline;text-underline-offset:2px;cursor:pointer}
  .recent-toggle:hover,.recent-toggle:focus-visible{color:var(--white)}
  .recent-overlay[hidden]{display:none}
  .recent-overlay{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:1.25rem;background:rgba(0,0,0,.82);backdrop-filter:blur(8px)}
  .recent-panel{width:min(100%,34rem);max-height:min(82dvh,42rem);overflow:auto;padding:1.35rem 1.5rem 1.5rem;border:1px solid rgba(255,255,255,.24);background:rgba(5,7,5,.94);box-shadow:0 1.5rem 5rem rgba(0,0,0,.45)}
  .recent-heading{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:1rem}
  .recent-heading h2{font-size:1.15rem;font-weight:900}
  .recent-close{border:0;background:none;color:var(--dim);font:inherit;font-size:1.4rem;line-height:1;cursor:pointer}
  .recent-close:hover,.recent-close:focus-visible{color:var(--white)}
  .recent-list{list-style:none}
  .recent-item{padding:.8rem 0;border-top:1px solid rgba(255,255,255,.18)}
  .recent-item a{color:var(--white);text-decoration:none}
  .recent-item a:hover,.recent-item a:focus-visible{text-decoration:underline;text-underline-offset:3px}
  .recent-track{font-weight:700}
  .recent-artist,.recent-time,.recent-message{color:var(--dim);font-size:.85rem}
  .recent-time{margin-top:.2rem;font-style:italic}
  .recent-message{padding:.8rem 0}
  @media(max-width:480px){.footer{align-items:flex-end}.meta{max-width:42%}.track{max-width:56vw}.recent-panel{padding:1.1rem}}
  .sr-only{
    position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
    clip:rect(0,0,0,0);white-space:nowrap;border:0;
  }
</style>
</head>
<body>
  <div class="page">
    <header class="title-wrap"><h1 class="title">sol&rsquo;s quicklinks</h1></header>

    <nav class="links" aria-label="Social links">
      <a class="link" id="discord-link" href="https://discord.com/users/903330250610577418" target="_blank" rel="noopener" aria-label="Discord">
        <img src="./assets/icons/discord.png" alt="" />
        <span class="status" aria-hidden="true"><span class="dot" id="discord-dot"></span><span id="discord-status-text">…</span></span>
      </a>
      <a class="link" id="instagram-link" href="https://www.instagram.com/sol.tar.xz/" target="_blank" rel="noopener" aria-label="Instagram">
        <img src="./assets/icons/instagram.png" alt="" />
      </a>
      <a class="link" id="tiktok-link" href="https://www.tiktok.com/@...solari" target="_blank" rel="noopener" aria-label="TikTok">
        <img src="./assets/icons/tiktok.png" alt="" />
      </a>
      <a class="link" id="spotify-link" href="https://open.spotify.com/user/312tpdqjc4wbmnjm6qhv2i5zxl5m?si=a65ec906b7d348e7" target="_blank" rel="noopener" aria-label="Spotify">
        <img src="./assets/icons/spotify.png" alt="" />
      </a>
    </nav>

    <footer class="footer">
      <div class="now-playing" id="now-playing" data-state="loading" aria-live="polite">
        <p class="eyebrow" id="np-label">Loading…</p>
        <p class="track" id="np-track"></p>
        <p class="artist" id="np-artist"></p>
        <p class="scrobble-time" id="np-time"></p>
      </div>
      <div class="meta">
        <p class="visitor" id="visitor-count">—</p>
        <span class="private" title="Not wired up yet">say something private</span>
      </div>
    </footer>
    <button class="recent-toggle" id="recent-toggle" type="button" aria-expanded="false" aria-controls="recent-overlay">last played tracks</button>
  </div>
  <section class="recent-overlay" id="recent-overlay" role="dialog" aria-modal="true" aria-labelledby="recent-title" hidden>
    <div class="recent-panel">
      <div class="recent-heading"><h2 id="recent-title">Last played tracks</h2><button class="recent-close" id="recent-close" type="button" aria-label="Close recent tracks">&times;</button></div>
      <p class="recent-message" id="recent-message" role="status">Loading tracks…</p><ol class="recent-list" id="recent-list"></ol>
      <p class="recent-message"><a href="https://www.last.fm/user/saltsaltsalty" target="_blank" rel="noopener" style="color:inherit">View saltsaltsalty on Last.fm ↗</a></p>
    </div>
  </section>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
  const CONFIG = {
    discordUserId: "903330250610577418",
    supabaseUrl: "https://rkgzstnvmimumyuykueg.supabase.co",
    supabaseKey: "sb_publishable_f9E2FP9NarrHQtO921R01Q_Hmbw_ynp"
  };

  const els = {
    discordLink:   document.getElementById("discord-link"),
    discordDot:    document.getElementById("discord-dot"),
    discordStatus: document.getElementById("discord-status-text"),
    nowPlaying:    document.getElementById("now-playing"),
    npTime:        document.getElementById("np-time"),
    npLabel:       document.getElementById("np-label"),
    npTrack:       document.getElementById("np-track"),
    npArtist:      document.getElementById("np-artist"),
    visitorCount:  document.getElementById("visitor-count"),
    recentToggle:  document.getElementById("recent-toggle"),
    recentOverlay: document.getElementById("recent-overlay"),
    recentClose:   document.getElementById("recent-close"),
    recentMessage: document.getElementById("recent-message"),
    recentList:    document.getElementById("recent-list")
  };

  function ordinal(n){
    const s = ["th","st","nd","rd"], v = n % 100;
    return n + (s[(v - 20) % 10] || s[v] || s[0]);
  }

  function setDiscordStatus(status){
    els.discordStatus.textContent = status;
    els.discordDot.dataset.status = status;
    els.discordLink.setAttribute("aria-label", "Discord — " + status);
  }

  async function getRecentTracks(){
    const response=await fetch(`https://raw.githubusercontent.com/ssolarii/sol-run-place/main/lastfm.json?updated=${Date.now()}`,{cache:"no-store"});
    if(!response.ok)throw new Error("Recent tracks are not available yet");
    const data=await response.json();
    lastFmUpdatedAt = Date.parse(data.updatedAt) || 0;
    return Array.isArray(data.tracks)?data.tracks:[];
  }

  function formatTrackTime(track){
    if(track["@attr"]&&track["@attr"].nowplaying==="true")return "Now scrobbling";
    const seconds=Number(track.date&&track.date.uts);
    if(!Number.isFinite(seconds)||seconds<=0)return "";
    return new Intl.DateTimeFormat(undefined,{dateStyle:"medium",timeStyle:"short"}).format(new Date(seconds*1000));
  }

  function renderCurrentTrack(tracks){
    const reportedNow=tracks.find(track=>track["@attr"]&&track["@attr"].nowplaying==="true");
    const latest=tracks.find(track=>!(track["@attr"]&&track["@attr"].nowplaying==="true"));
    const fresh=lastFmUpdatedAt>0 && Date.now()-lastFmUpdatedAt<180000;
    const current=reportedNow||latest;
    els.nowPlaying.dataset.state=reportedNow&&fresh?"now":"last";
    els.npLabel.textContent=reportedNow
      ? fresh?"Now scrobbling":"Scrobbling at last sync"
      : latest?"Last scrobble":"No recent scrobbles";
    els.npTrack.textContent=current&&current.name||"";
    els.npArtist.textContent=current&&current.artist&&(current.artist["#text"]||current.artist.name)||"";
    els.npTime.textContent=reportedNow
      ? lastFmUpdatedAt?"Last.fm checked "+new Intl.DateTimeFormat(undefined,{timeStyle:"short"}).format(new Date(lastFmUpdatedAt)):"Awaiting the next Last.fm sync"
      : latest?formatTrackTime(latest):"";
  }

  function createTrackItem(track){
    const item=document.createElement("li");item.className="recent-item";
    const link=document.createElement("a");
    try{
      const url=new URL(track.url);
      link.href=url.hostname==="last.fm"||url.hostname.endsWith(".last.fm")?url.href:"https://www.last.fm/user/saltsaltsalty";
    }catch{link.href="https://www.last.fm/user/saltsaltsalty";}
    link.target="_blank";link.rel="noopener";
    const title=document.createElement("div");title.className="recent-track";title.textContent=track.name||"Untitled track";
    const artist=document.createElement("div");artist.className="recent-artist";artist.textContent=track.artist&&(track.artist["#text"]||track.artist.name)||"Unknown artist";
    link.append(title,artist);item.append(link);
    const time=formatTrackTime(track);
    if(time){const stamp=document.createElement("div");stamp.className="recent-time";stamp.textContent=time;item.append(stamp);}
    return item;
  }

  let recentTracks=[];
  let lastFmUpdatedAt=0;
  function showRecentTracks(){
    els.recentList.replaceChildren();
    const played=recentTracks.filter(track=>!(track["@attr"]&&track["@attr"].nowplaying==="true"));
    if(!played.length){els.recentMessage.hidden=false;els.recentMessage.textContent="No recent scrobbles yet.";return;}
    els.recentMessage.hidden=true;
    played.forEach(track=>els.recentList.append(createTrackItem(track)));
  }

  function openRecentTracks(){
    els.recentOverlay.hidden=false;els.recentToggle.setAttribute("aria-expanded","true");els.recentClose.focus();
    showRecentTracks();
  }
  function closeRecentTracks(){
    els.recentOverlay.hidden=true;els.recentToggle.setAttribute("aria-expanded","false");els.recentToggle.focus();
  }
  els.recentToggle.addEventListener("click",openRecentTracks);
  els.recentClose.addEventListener("click",closeRecentTracks);
  els.recentOverlay.addEventListener("click",event=>{if(event.target===els.recentOverlay)closeRecentTracks();});
  document.addEventListener("keydown",event=>{if(event.key==="Escape"&&!els.recentOverlay.hidden)closeRecentTracks();});

  async function updateLastFm(){
    try{
      recentTracks=await getRecentTracks();
      renderCurrentTrack(recentTracks);
      if(!els.recentOverlay.hidden)showRecentTracks();
    }catch(error){
      console.warn("Last.fm tracks unavailable.",error);
      if(!recentTracks.length)els.npLabel.textContent="Last.fm updates pending";
    }
  }

  async function bumpVisitorCount(){
    if (!window.supabase || !CONFIG.supabaseUrl) return;
    try {
      const client = window.supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseKey);
      const seenKey = "sols-quicklinks-seen";
      let count;

      if (!sessionStorage.getItem(seenKey)) {
        const { data, error } = await client.rpc("increment_visitor_count");
        if (error) throw error;
        count = data;
        sessionStorage.setItem(seenKey, "1");
      } else {
        const { data, error } = await client.from("visitors").select("count").eq("id", 1).single();
        if (error) throw error;
        count = data.count;
      }

      if (typeof count !== "number" || !isFinite(count)) throw new Error("Bad visitor count");
      els.visitorCount.textContent = ordinal(count) + " visitor";
    } catch (e) {
      console.warn("Visitor counter unavailable.", e);
      els.visitorCount.textContent = "— visitors";
    }
  }

  let presenceSocket=null, heartbeatTimer=null, reconnectTimer=null, fallbackTimer=null, handshakeTimer=null;
  let reconnectDelay=1000, presenceRequest=null, hasPresence=false;

  function applyPresence(data){
    if(!data || !data.discord_status)return;
    hasPresence=true;
    setDiscordStatus(data.discord_status);
  }

  async function updatePresence(){
    if(document.hidden || presenceRequest)return;
    presenceRequest=(async()=>{
      try{
        const response=await fetch(`https://api.lanyard.rest/v1/users/${CONFIG.discordUserId}`,{signal:AbortSignal.timeout(8000)});
        const result=await response.json();
        if(!response.ok || !result.success || !result.data)throw new Error("Presence unavailable");
        applyPresence(result.data);
      }catch(error){
        if(!hasPresence){
          els.discordStatus.textContent="status unavailable";
          els.discordDot.dataset.status="offline";
          els.discordLink.setAttribute("aria-label","Discord — status unavailable");
        }
      }finally{presenceRequest=null;}
    })();
    await presenceRequest;
  }

  function startPresenceFallback(){
    if(document.hidden || fallbackTimer)return;
    updatePresence();
    fallbackTimer=setInterval(updatePresence,60000);
  }

  function connectPresence(){
    if(document.hidden || presenceSocket)return;
    clearTimeout(reconnectTimer);
    let socket;
    try{socket=new WebSocket("wss://api.lanyard.rest/socket");}
    catch{startPresenceFallback();reconnectTimer=setTimeout(connectPresence,30000);return;}
    presenceSocket=socket;
    handshakeTimer=setTimeout(()=>socket.close(),10000);
    socket.onmessage=event=>{
      if(presenceSocket!==socket)return;
      try{
        const message=JSON.parse(event.data);
        if(message.op===1){
          socket.send(JSON.stringify({op:2,d:{subscribe_to_id:CONFIG.discordUserId}}));
          clearInterval(heartbeatTimer);
          heartbeatTimer=setInterval(()=>{
            if(socket.readyState===WebSocket.OPEN)socket.send(JSON.stringify({op:3}));
          },Math.max(1000,Number(message.d.heartbeat_interval)||30000));
        }else if(message.op===0 && (message.t==="INIT_STATE" || message.t==="PRESENCE_UPDATE")){
          clearTimeout(handshakeTimer);
          clearInterval(fallbackTimer);fallbackTimer=null;reconnectDelay=1000;
          applyPresence(message.d);
        }
      }catch{socket.close();}
    };
    socket.onerror=()=>socket.close();
    socket.onclose=()=>{
      if(presenceSocket!==socket)return;
      presenceSocket=null;clearInterval(heartbeatTimer);clearTimeout(handshakeTimer);
      if(!document.hidden){
        startPresenceFallback();
        reconnectTimer=setTimeout(connectPresence,reconnectDelay);
        reconnectDelay=Math.min(reconnectDelay*2,30000);
      }
    };
  }

  function pausePresence(){
    clearTimeout(reconnectTimer);clearTimeout(handshakeTimer);
    clearInterval(heartbeatTimer);clearInterval(fallbackTimer);fallbackTimer=null;
    const socket=presenceSocket;presenceSocket=null;
    if(socket)socket.close();
  }

  document.addEventListener("visibilitychange",()=>{
    if(document.hidden)pausePresence();
    else{connectPresence();updateLastFm();}
  });
  window.addEventListener("pagehide",pausePresence);
  window.addEventListener("pageshow",()=>{if(!document.hidden)connectPresence();});

  bumpVisitorCount();
  updatePresence();
  connectPresence();
  updateLastFm();
  setInterval(()=>{if(!document.hidden)updateLastFm();},60000);
  </script>
</body>
</html>
